name: Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded in-progress runs for the same branch / PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Runs everything in .pre-commit-config.yaml (ruff, black, mypy, hadolint, the asset scan);
  # without this job the hooks are only enforced on machines that installed them.
  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # setup-uv no longer publishes a moving major tag, so pin a full version.
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      # The mypy hook runs `uv run mypy` from the project venv (language: system) so the
      # django-stubs plugin can import the settings + models, hence a full sync first.
      - name: Sync environment
        run: uv sync --frozen

      - name: Cache pre-commit hook environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit on all files
        run: uv run pre-commit run --all-files --show-diff-on-failure

  test:
    name: Tests + coverage (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Build the `test` stage once, caching the heavy layers (apt, uv deps, the
      # Lean toolchain) in the GitHub Actions cache so later runs skip rebuilding
      # them. `load: true` puts the image into the local Docker daemon so we can
      # run it in the next step.
      - name: Build test image (cached)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: test
          load: true
          tags: pisa-test:ci
          cache-from: type=gha
          # Only write the cache from main, so PRs reuse main's layers without each branch
          # repopulating the (size-limited) Actions cache.
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max' || '' }}

      # Run the suite under coverage inside the image. The container is named (not
      # --rm) so we can copy the reports out even if tests fail.
      # The default bubblewrap Lean sandbox needs all three grants inside Docker (same as the
      # compose files): `seccomp=unconfined` for unprivileged user namespaces,
      # `apparmor=unconfined` for its mount namespace setup, and `systempaths=unconfined` so
      # the kernel accepts its fresh /proc mount. With these the real-Lean sandbox tests
      # exercise the production isolation.
      - name: Run tests with coverage
        run: |
          docker run --name pisa-tests \
            --security-opt seccomp=unconfined \
            --security-opt apparmor=unconfined \
            --security-opt systempaths=unconfined \
            -e SECRET_KEY=ci-test-secret-key-not-for-production \
            pisa-test:ci \
            sh -c 'coverage run manage.py test --verbosity=2; status=$?; coverage report; coverage xml; coverage html; exit $status'

      - name: Extract coverage reports
        if: always()
        run: |
          mkdir -p coverage-out
          docker cp pisa-tests:/app/coverage.xml coverage-out/coverage.xml || true
          docker cp pisa-tests:/app/htmlcov coverage-out/htmlcov || true
          docker rm pisa-tests || true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-out/
          if-no-files-found: warn
